[package]
name = "dns-ingress"
version = "1.0.4"
edition = "2024"
readme = "README.md"
repository = "https://github.com/ttimochan/dns-ingress"
license = "AGPL-3.0"
authors = ["ttimochan"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rustls-native-certs = "0.8"
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27", features = ["http2", "native-tokio"] }
http-body-util = "0.1"
bytes = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono"] }
tracing-appender = "0.2"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dashmap = "7.0.0-rc2"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio-test = "0.4"
