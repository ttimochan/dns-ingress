name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-all:
    name: Build All Packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Build amd64
        run: cargo build --release --locked

      - name: Build arm64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          cargo build --release --locked --target aarch64-unknown-linux-gnu

      - name: Create dist directory
        run: mkdir -p dist

      - name: Create Debian amd64 package
        run: bash scripts/create-deb.sh amd64 x86_64-unknown-linux-gnu ${{ steps.version.outputs.VERSION }}

      - name: Create Debian arm64 package
        run: bash scripts/create-deb.sh arm64 aarch64-unknown-linux-gnu ${{ steps.version.outputs.VERSION }}

      - name: Create RPM amd64 package
        run: bash scripts/create-rpm.sh amd64 x86_64-unknown-linux-gnu ${{ steps.version.outputs.VERSION }}

      - name: Create RPM arm64 package
        run: bash scripts/create-rpm.sh arm64 aarch64-unknown-linux-gnu ${{ steps.version.outputs.VERSION }}

      - name: Create Arch package
        run: bash scripts/create-arch.sh ${{ steps.version.outputs.VERSION }}

      - name: Create source archive
        run: git archive --format=tar.gz --prefix=dns-ingress-${{ steps.version.outputs.VERSION }}/ -o dist/dns-ingress-${{ steps.version.outputs.VERSION }}-source.tar.gz HEAD

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-all
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            sed -n "/^## \[${{ steps.version.outputs.VERSION }}\]/,/^## \[/p" CHANGELOG.md | sed '$d' > changelog.txt
          else
            echo "Release ${{ steps.version.outputs.VERSION }}" > changelog.txt
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          tag_name: v${{ steps.version.outputs.VERSION }}
          body_path: changelog.txt
          draft: false
          prerelease: false
          files: dist/*

  docker-push:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    needs: build-all
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: timochan/dns-ingress
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
