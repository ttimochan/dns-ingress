name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binary:
    name: Build Binaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install Zig
        run: |
          wget -q https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar -xf zig-linux-x86_64-0.13.0.tar.xz
          echo "$PWD/zig-linux-x86_64-0.13.0" >> $GITHUB_PATH
          rm zig-linux-x86_64-0.13.0.tar.xz

      - name: Install Rust targets
        run: |
          rustup target add x86_64-unknown-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Build amd64 binary
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu

      - name: Build arm64 binary
        run: cargo zigbuild --release --target aarch64-unknown-linux-gnu

      - name: Upload amd64 binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-amd64
          path: target/x86_64-unknown-linux-gnu/release/dns-ingress

      - name: Upload arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-arm64
          path: target/aarch64-unknown-linux-gnu/release/dns-ingress

  package-deb-amd64:
    name: Package Debian amd64
    runs-on: ubuntu-latest
    needs: build-binary
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-amd64
          path: dist

      - name: Create Debian package
        run: |
          mv dist/dns-ingress dist/dns-ingress-${{ needs.build-binary.outputs.version }}-linux-amd64
          bash scripts/create-deb.sh amd64 x86_64-unknown-linux-gnu dist/dns-ingress-${{ needs.build-binary.outputs.version }}-linux-amd64 ${{ needs.build-binary.outputs.version }}

      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: dist/dns-ingress_*.deb

  package-deb-arm64:
    name: Package Debian arm64
    runs-on: ubuntu-latest
    needs: build-binary
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-arm64
          path: dist

      - name: Create Debian package
        run: |
          mv dist/dns-ingress dist/dns-ingress-${{ needs.build-binary.outputs.version }}-linux-arm64
          bash scripts/create-deb.sh arm64 aarch64-unknown-linux-gnu dist/dns-ingress-${{ needs.build-binary.outputs.version }}-linux-arm64 ${{ needs.build-binary.outputs.version }}

      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: deb-arm64
          path: dist/dns-ingress_*.deb

  package-rpm-amd64:
    name: Package RPM amd64
    runs-on: ubuntu-latest
    needs: build-binary
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-amd64
          path: dist

      - name: Create RPM package
        run: |
          mv dist/dns-ingress dist/dns-ingress-${{ needs.build-binary.outputs.version }}-linux-amd64
          bash scripts/create-rpm.sh amd64 x86_64-unknown-linux-gnu dist/dns-ingress-${{ needs.build-binary.outputs.version }}-linux-amd64 ${{ needs.build-binary.outputs.version }}

      - name: Upload rpm package
        uses: actions/upload-artifact@v4
        with:
          name: rpm-amd64
          path: dist/dns-ingress-*.rpm

  package-rpm-arm64:
    name: Package RPM arm64
    runs-on: ubuntu-arm64
    needs: build-binary
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-arm64
          path: dist

      - name: Create RPM package
        run: |
          mv dist/dns-ingress dist/dns-ingress-${{ needs.build-binary.outputs.version }}-linux-arm64
          bash scripts/create-rpm.sh arm64 aarch64-unknown-linux-gnu dist/dns-ingress-${{ needs.build-binary.outputs.version }}-linux-arm64 ${{ needs.build-binary.outputs.version }}

      - name: Upload rpm package
        uses: actions/upload-artifact@v4
        with:
          name: rpm-arm64
          path: dist/dns-ingress-*.rpm

  package-arch-amd64:
    name: Package Arch amd64
    runs-on: ubuntu-latest
    needs: build-binary
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-amd64
          path: dist

      - name: Create Arch package
        run: |
          mv dist/dns-ingress dist/dns-ingress-${{ needs.build-binary.outputs.version }}-linux-amd64
          bash scripts/create-arch.sh dist/dns-ingress-${{ needs.build-binary.outputs.version }}-linux-amd64 ${{ needs.build-binary.outputs.version }}

      - name: Upload arch package
        uses: actions/upload-artifact@v4
        with:
          name: arch-amd64
          path: dist/dns-ingress-*.pkg.tar.zst

  package-arch-arm64:
    name: Package Arch arm64
    runs-on: ubuntu-arm64
    needs: build-binary
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-arm64
          path: dist

      - name: Create Arch package
        run: |
          mv dist/dns-ingress dist/dns-ingress-${{ needs.build-binary.outputs.version }}-linux-arm64
          bash scripts/create-arch.sh dist/dns-ingress-${{ needs.build-binary.outputs.version }}-linux-arm64 ${{ needs.build-binary.outputs.version }}

      - name: Upload arch package
        uses: actions/upload-artifact@v4
        with:
          name: arch-arm64
          path: dist/dns-ingress-*.pkg.tar.zst

  package-source:
    name: Package Source
    runs-on: ubuntu-latest
    needs: build-binary
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=dns-ingress-${{ needs.build-binary.outputs.version }}/ -o dist/dns-ingress-${{ needs.build-binary.outputs.version }}-source.tar.gz HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/dns-ingress-*-source.tar.gz

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-binary
      - package-deb-amd64
      - package-deb-arm64
      - package-rpm-amd64
      - package-rpm-arm64
      - package-arch-amd64
      - package-arch-arm64
      - package-source
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            sed -n "/^## \[${{ steps.version.outputs.VERSION }}\]/,/^## \[/p" CHANGELOG.md | sed '$d' > changelog.txt
          else
            echo "Release ${{ steps.version.outputs.VERSION }}" > changelog.txt
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          tag_name: v${{ steps.version.outputs.VERSION }}
          body_path: changelog.txt
          draft: false
          prerelease: false
          files: dist/*

  docker-push:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    needs: build-binary
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: timochan/dns-ingress
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
